<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahim Shop</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:#111827;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}
.top{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:23px;font-weight:bold}
.cart-btn{
  border:0;
  background:#22c55e;
  color:white;
  padding:10px 15px;
  border-radius:9px;
  font-size:16px;
}
.search{
  display:block;
  width:100%;
  max-width:1100px;
  margin:12px auto 0;
  padding:13px;
  border:0;
  border-radius:9px;
  font-size:16px;
}
main{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.hero{
  background:white;
  border-radius:15px;
  padding:25px;
  text-align:center;
  margin-bottom:20px;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
}
.product{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 9px #0001;
}
.product img{
  width:100%;
  height:210px;
  object-fit:cover;
}
.info{padding:14px}
.price{
  color:#16a34a;
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}
.add{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:15px;
}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:200;
  padding:15px;
  overflow:auto;
}
.modal{
  background:white;
  max-width:600px;
  margin:25px auto;
  padding:20px;
  border-radius:15px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.close{
  background:#ef4444;
  color:white;
  border:0;
  padding:8px 12px;
  border-radius:7px;
}
.cart-item{
  padding:12px 0;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:5px;
}
.total{
  text-align:right;
  font-size:22px;
  font-weight:bold;
  margin:18px 0;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
textarea{min-height:90px}
.order{
  width:100%;
  padding:14px;
  background:#22c55e;
  color:white;
  border:0;
  border-radius:9px;
  font-size:18px;
  font-weight:bold;
}
.payment{
  background:#f3f4f6;
  padding:12px;
  border-radius:9px;
  margin-bottom:12px;
}
.pay-number{
  font-weight:bold;
  color:#111827;
}
footer{
  text-align:center;
  padding:30px;
  color:#666;
}
@media(max-width:600px){
  .products{grid-template-columns:repeat(2,1fr);gap:10px}
  .product img{height:150px}
  .info{padding:10px}
  .product h3{font-size:16px}
  .price{font-size:17px}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">🛍️ Mahim Shop</div>

    <button class="cart-btn" onclick="openCart()">
      🛒 Cart (<span id="count">0</span>)
    </button>
  </div>

  <input
    class="search"
    id="search"
    placeholder="🔎 প্রোডাক্ট খুঁজুন..."
    oninput="searchProducts()"
  >
</header>

<main>

<section class="hero">
  <h1>স্বাগতম Mahim Shop-এ</h1>
  <p>আপনার পছন্দের প্রোডাক্ট বেছে নিয়ে অর্ডার করুন।</p>
</section>

<div id="products" class="products"></div>

</main>

<footer>
  © 2026 Mahim Shop
</footer>

<!-- CART / ORDER -->

<div id="overlay" class="overlay">

<div class="modal">

<div class="modal-head">
  <h2>🛒 আপনার Cart</h2>
  <button class="close" onclick="closeCart()">✕</button>
</div>

<div id="cartItems"></div>

<div class="total">
  পণ্যের মোট: ৳<span id="subtotal">0</span><br>

  <span style="font-size:17px;font-weight:normal">
    ডেলিভারি চার্জ: ৳<span id="deliveryCharge">0</span>
  </span><br>

  সর্বমোট: ৳<span id="total">0</span>
</div>

<h2>📦 অর্ডারের তথ্য</h2>

<label>নাম *</label>
<input id="name" placeholder="আপনার নাম">

<label>ফোন নম্বর *</label>
<input id="phone" type="tel" placeholder="01XXXXXXXXX">

<label>সম্পূর্ণ ঠিকানা *</label>
<textarea id="address" placeholder="আপনার ঠিকানা"></textarea>

<label>ডেলিভারি এলাকা *</label>

<select id="deliveryArea" onchange="updateOrderTotal()">
  <option value="">এলাকা নির্বাচন করুন</option>
  <option value="dhaka">ঢাকার ভিতরে — ডেলিভারি চার্জ ৳80</option>
  <option value="outside">ঢাকার বাইরে — ডেলিভারি চার্জ ৳125</option>
</select>

<div id="deliveryInfo" class="payment"></div>

<label>পেমেন্ট পদ্ধতি *</label>

<select id="payment" onchange="showPayment(); updateOrderTotal()">
  <option value="">পেমেন্ট নির্বাচন করুন</option>
  <option value="Cash on Delivery">Cash on Delivery</option>
  <option value="bKash">bKash</option>
  <option value="Nagad">Nagad</option>
</select>

<div id="paymentInfo"></div>

<label>অতিরিক্ত নোট</label>

<textarea
  id="note"
  placeholder="অতিরিক্ত কোনো তথ্য থাকলে লিখুন">
</textarea>

<button class="order" onclick="placeOrder()">
  📲 অর্ডার করুন
</button>

</div>
</div>

<script>

/* ================================
   আপনার নম্বর
================================ */

const WHATSAPP_NUMBER = "8801624622460";

const BKASH_NUMBER = "01932558716";

const NAGAD_NUMBER = "01932558716";


/* ================================
   আপনার প্রোডাক্ট
================================ */

const products = [

{
  id:1,
  name:"টি-শার্ট",
  price:650,
  image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
},

{
  id:2,
  name:"জুতা",
  price:1200,
  image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
},

{
  id:3,
  name:"ঘড়ি",
  price:950,
  image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80"
},

{
  id:4,
  name:"ব্যাগ",
  price:850,
  image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80"
}

];

let cart=[];


/* PRODUCTS */

function displayProducts(list=products){

const box=document.getElementById("products");

if(list.length===0){
  box.innerHTML="<p>কোনো প্রোডাক্ট পাওয়া যায়নি।</p>";
  return;
}

box.innerHTML=list.map(p=>`

<div class="product">

<img src="${p.image}" alt="${p.name}">

<div class="info">

<h3>${p.name}</h3>

<div class="price">
৳${p.price}
</div>

<button class="add" onclick="addToCart(${p.id})">
🛒 Cart-এ যোগ করুন
</button>

</div>

</div>

`).join("");

}


/* ADD */

function addToCart(id){

const product=products.find(p=>p.id===id);

const item=cart.find(p=>p.id===id);

if(item){
  item.quantity++;
}else{
  cart.push({...product,quantity:1});
}

updateCart();

alert(product.name+" Cart-এ যোগ হয়েছে!");

}


/* CART */

function updateCart(){

const count=cart.reduce(
  (sum,p)=>sum+p.quantity,0
);

document.getElementById("count").textContent=count;

renderCart();

}


function renderCart(){

const box=document.getElementById("cartItems");

if(cart.length===0){

box.innerHTML="<p style='text-align:center'>আপনার Cart খালি।</p>";

document.getElementById("subtotal").textContent="0";
document.getElementById("deliveryCharge").textContent="0";
document.getElementById("total").textContent="0";

return;
}


box.innerHTML=cart.map(p=>`

<div class="cart-item">

<div>
<strong>${p.name}</strong><br>
৳${p.price} × ${p.quantity}
</div>

<div class="qty">

<button onclick="changeQty(${p.id},-1)">
−
</button>

${p.quantity}

<button onclick="changeQty(${p.id},1)">
+
</button>

</div>

</div>

`).join("");


updateOrderTotal();

}


function changeQty(id,change){

const item=cart.find(p=>p.id===id);

if(!item)return;

item.quantity+=change;

if(item.quantity<=0){
  cart=cart.filter(p=>p.id!==id);
}

updateCart();

}


/* DELIVERY CHARGE */

function getDeliveryCharge(){

const payment=document.getElementById("payment").value;

const area=document.getElementById("deliveryArea").value;

/*
  ডেলিভারি চার্জ শুধু Cash on Delivery-এর জন্য
*/

if(payment!=="Cash on Delivery"){
  return 0;
}

if(area==="dhaka"){
  return 80;
}

if(area==="outside"){
  return 125;
}

return 0;

}


function updateOrderTotal(){

const subtotal=cart.reduce(
  (sum,p)=>sum+(p.price*p.quantity),0
);

const deliveryCharge=getDeliveryCharge();

document.getElementById("subtotal").textContent=subtotal;

document.getElementById("deliveryCharge").textContent=deliveryCharge;

document.getElementById("total").textContent=
  subtotal+deliveryCharge;


const info=document.getElementById("deliveryInfo");

const payment=document.getElementById("payment").value;

const area=document.getElementById("deliveryArea").value;


if(payment!=="Cash on Delivery"){

info.innerHTML=
"<strong>🚚 ডেলিভারি চার্জ</strong><br>"+
"Cash on Delivery নির্বাচন করলে ঢাকার ভিতরে ৳80 এবং ঢাকার বাইরে ৳125 যোগ হবে।";

}

else if(area==="dhaka"){

info.innerHTML=
"<strong>🚚 ডেলিভারি চার্জ: ৳80</strong><br>"+
"ঢাকার ভিতরে";

}

else if(area==="outside"){

info.innerHTML=
"<strong>🚚 ডেলিভারি চার্জ: ৳125</strong><br>"+
"ঢাকার বাইরে";

}

else{

info.innerHTML=
"<strong>🚚 ডেলিভারি এলাকা নির্বাচন করুন</strong>";

}

}


/* OPEN / CLOSE */

function openCart(){

document.getElementById("overlay").style.display="block";

renderCart();

}


function closeCart(){

document.getElementById("overlay").style.display="none";

}


/* SEARCH */

function searchProducts(){

const text=document
.getElementById("search")
.value
.toLowerCase();

const result=products.filter(p=>
p.name.toLowerCase().includes(text)
);

displayProducts(result);

}


/* PAYMENT */

function showPayment(){

const payment=
document.getElementById("payment").value;

const box=
document.getElementById("paymentInfo");


if(payment==="bKash"){

box.innerHTML=`

<div class="payment">

<strong>💳 bKash Payment</strong>

<p>
এই নম্বরে bKash করুন:
</p>

<div class="pay-number">
${BKASH_NUMBER}
</div>

<small>
পেমেন্ট করার পর অর্ডার করুন।
</small>

</div>

`;

}

else if(payment==="Nagad"){

box.innerHTML=`

<div class="payment">

<strong>💳 Nagad Payment</strong>

<p>
এই নম্বরে Nagad করুন:
</p>

<div class="pay-number">
${NAGAD_NUMBER}
</div>

<small>
পেমেন্ট করার পর অর্ডার করুন।
</small>

</div>

`;

}

else{

box.innerHTML="";

}

}


/* ORDER */

function placeOrder(){

if(cart.length===0){

alert("প্রথমে Cart-এ প্রোডাক্ট যোগ করুন।");

return;

}


const name=
document.getElementById("name").value.trim();

const phone=
document.getElementById("phone").value.trim();

const address=
document.getElementById("address").value.trim();

const payment=
document.getElementById("payment").value;

const deliveryArea=
document.getElementById("deliveryArea").value;

const note=
document.getElementById("note").value.trim();


if(!name || !phone || !address){

alert("নাম, ফোন নম্বর এবং ঠিকানা পূরণ করুন।");

return;

}


if(!payment){

alert("একটি পেমেন্ট পদ্ধতি নির্বাচন করুন।");

return;

}


if(!deliveryArea){

alert("ডেলিভারি এলাকা নির্বাচন করুন।");

return;

}


const subtotal=cart.reduce(
(sum,p)=>sum+(p.price*p.quantity),0
);

const deliveryCharge=getDeliveryCharge();

const total=subtotal+deliveryCharge;

const areaText=
deliveryArea==="dhaka"
? "ঢাকার ভিতরে"
: "ঢাকার বাইরে";


let orderText="";


cart.forEach(p=>{

const itemTotal=p.price*p.quantity;

orderText+=
"• "+p.name+
" × "+p.quantity+
" = ৳"+itemTotal+"\n";

});


let message=
`🛍️ *নতুন অর্ডার - Mahim Shop*

👤 নাম: ${name}
📱 ফোন: ${phone}
📍 ঠিকানা: ${address}

🛒 অর্ডার:
${orderText}

💰 পণ্যের মোট: ৳${subtotal}
🚚 ডেলিভারি: ${areaText}
📦 ডেলিভারি চার্জ: ৳${deliveryCharge}
💰 সর্বমোট: ৳${total}

💳 পেমেন্ট: ${payment}`;


if(payment==="bKash"){

message+=
`\n💳 bKash নম্বর: ${BKASH_NUMBER}`;

}


if(payment==="Nagad"){

message+=
`\n💳 Nagad নম্বর: ${NAGAD_NUMBER}`;

}


if(note){

message+=
`\n📝 নোট: ${note}`;

}


message+=
"\n\nধন্যবাদ ❤️";


const url=
"https://wa.me/"+
WHATSAPP_NUMBER+
"?text="+
encodeURIComponent(message);


window.open(url,"_blank");

}


/* START */

displayProducts();

updateCart();

</script>

</body>
</html>
